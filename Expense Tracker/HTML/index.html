<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Expense Tracker</h1>
        <button id="theme-btn">&#127769;</button>
    </header>

    <main>
        <!--Summary Section-->
        <section class="summary">
            <div class="summary-card">
                <h3>Total Spending</h3>
                <p id="total spending">₹0</p>
            </div>
            <div class="summary-card">
                <h3>This Month</h3>
                <p id=""monthly-spending>₹0</p>
            </div>
            <div class="summary-card">
                <h3>Expenses</h3>
                <p id="expense-count">0</p>
            </div>
        </section>
        <!--Add Expenses-->
        <section class="expenses-form-section">
            <h2>Add Expenses</h2>
            <form id="expense-form">
                <div>
                    <!-- the for attribute is not a general attribute for every tag it is a specific tag for label which connects the label to a form control 
                     
                    We usually click inside the input to start typing but here we can click on the label 

                    This is especially useful for things like checkboxes and radio buttons, where the clickable area can become easier to use.
                    -->
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g. Lunch" required>
                </div>
                <div>
                    <label for="amount">Amount</label>

                    <input
                        type="number"
                        id="amount"
                        placeholder="e.g. 250"
                        min="1"
                        required
                    >
                </div>
                <div>
                    <label for="category">Category</label>
                    <select id="category" required>
                        <option value="">Select Category</option>
                        <option value="Food">Food</option>
                        <option value="Travel">Travel</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Bills">Bills</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div>
                    <label for="data">Date</label>
                    <input type="data" id="date" required>
                </div>
                <button type="submit">
                    Add Expense
                </button>
            </form>
        </section>
        <!--Filters-->
        <section class="filters">
            <input type="text" id="search" placeholder="Search expenses...">
            <select id="category-filter">

                <option value="all">All Categories</option>

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Other">Other</option>
                
            </select>
             <select id="sort">

                <option value="newest">Newest First</option>
                <option value="oldest">Oldest First</option>
                <option value="high">Highest Amount</option>
                <option value="low">Lowest Amount</option>

            </select>

        </section>
        <section class="expenses-section">

            <h2>Expenses</h2>

            <div id="expense-list">

                <!-- JavaScript will insert expenses here -->

            </div>

        </section>
    </main>
    <script src="js/script.js"></script>
</body>
</html>
